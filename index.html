/* ================= агент ================= */
function aRow(label, value, cls) {
  return `<div class="arow"><span>${label}</span><b class="${cls || ''}">${value}</b></div>`;
}

function findItemByText(q) {
  let best = null, bestScore = 0;
  S.items.forEach((it) => {
    const nm = norm(it.name);
    if (!nm) return;
    let sc = 0;
    if (q.includes(nm)) sc += 10;
    const words = nm.split(/[^a-zа-я0-9]+/).filter((w) => w.length > 2);
    words.forEach((w) => {
      const stem = w.length > 5 ? w.slice(0, -2) : w;
      if (q.includes(stem)) sc += 2;
      else if (q.includes(stem.slice(0, Math.max(3, Math.ceil(stem.length * 0.7))))) sc += 1;
    });
    if (sc > bestScore) { bestScore = sc; best = it; }
  });
  if (best && bestScore >= 2) return best;
  for (const it of S.items) {
    if (it.category && q.includes(norm(it.category))) return it;
  }
  return null;
}

function daysText(d) {
  return d === Infinity ? 'бессрочно' : Math.round(d) + ' дн';
}

function aItemCard(it) {
  const r = purchaseRow(it);
  const c = calcItem(it, r.ch, r.price);
  const verdict = !r.known
    ? '<b class="warn">Закупка не указана — максимум закупа считаю от целевой маржи.</b>'
    : r.verdict === 'no'
      ? '<b class="neg">По этой закупке экономика не проходит.</b>'
      : r.verdict === 'over'
        ? '<b class="warn">Излишек: деньги заморожены.</b>'
        : r.si.qty <= 0
          ? '<b class="neg">Нет в наличии — витрина теряет продажи.</b>'
          : '<b class="pos">Экономика рабочая.</b>';
  return `<b>${esc(it.name)}</b> · ${esc(r.ch.name)} · ${nf.format(it.qty)} шт
  <div class="acard">
    ${aRow('Остаток', nf.format(it.qty) + ' шт')}
    ${aRow('Скорость', nf1.format(r.si.vel.v) + ' шт/мес · ' + velSrcLabel(r.si.vel.src))}
    ${aRow('Хватит на', daysText(r.si.days))}
    ${aRow('Цена продажи', money(r.price))}
    ${aRow('Закупка', r.known ? money(r.cost) : 'не указана')}
    ${aRow('Прибыль с единицы', r.known ? money(c.profit) : '—', c.profit >= 0 ? 'pos' : 'neg')}
    ${aRow('Маржа / ROI', r.known ? pctf(c.margin) + ' / ' + pctf(c.roi) : '—')}
    ${aRow('Макс. закуп', r.maxCostTarget > 0 ? money(r.maxCostTarget) : '—')}
  </div>
  <div class="acard">${verdict}<br>
  ${r.si.reco > 0 ? `<br>К закупу: <b>${r.si.reco} шт</b> до ${money(r.maxCostTarget)}/шт.` : '<br>Докупать пока не нужно.'}</div>`;
}

function aChannels(it) {
  const target = n(S.settings.targetMargin);
  if (it) {
    const rows = S.channels.map((ch) => ({
      ch,
      net: netProceeds(it, ch, it.price),
      maxCost: maxCostFor(it, ch, it.price, target)
    })).sort((a, b) => b.net - a.net);
    const best = rows[0];
    return `<b>Где продавать «${esc(it.name)}»</b>
    <div class="acard">
      <table>
        <tr><th>Канал</th><th>До закупки</th><th>Макс. закуп</th></tr>
        ${rows.map((r) => `<tr><td>${esc(r.ch.name)}${r.ch.id === it.channel ? ' · сейчас' : ''}${r === best ? ' ★' : ''}</td><td class="${r.net >= 0 ? 'pos' : 'neg'}">${money(r.net)}</td><td>${r.maxCost > 0 ? money(r.maxCost) : '—'}</td></tr>`).join('')}
      </table>
    </div>
    <div class="acard">Больше денег до оплаты поставщику остаётся на <b class="pos">${esc(best.ch.name)}</b>: ${money(best.net)} с единицы.
    ${best.ch.id !== it.channel ? ` Если перенести продажи, это ${money((best.net - netProceeds(it, channelOf(it.channel), it.price)) * n(it.qty))} на остатках.` : ' Это ваш текущий канал.'}
    Оба канала стоит держать: Avito даёт поисковый трафик, Telegram — повторные продажи.</div>`;
  }
  const rows = S.channels.map((ch) => ({ ch, t: totals(ch) })).sort((a, b) => b.t.profit - a.t.profit);
  const best = rows[0];
  return `<b>Avito против Telegram</b>
  <div class="acard">
    <table>
      <tr><th>Канал</th><th>Прибыль склада</th><th>Маржа</th></tr>
      ${rows.map((r) => `<tr><td>${esc(r.ch.name)}${r === best ? ' ★' : ''}</td><td class="${r.t.profit >= 0 ? 'pos' : 'neg'}">${money(r.t.profit)}</td><td>${pctf(r.t.margin)}</td></tr>`).join('')}
    </table>
  </div>
  <div class="acard">Выгоднее <b class="pos">${esc(best.ch.name)}</b>: ${money(best.t.profit)} на текущих остатках. Разница — <b class="warn">${money(best.t.profit - rows[rows.length - 1].t.profit)}</b>. Уточните товар — сравню по нему.</div>`;
}

function aPrice(it, override) {
  const ch = channelOf(it.channel);
  const cur = calcItem(it, ch);
  const be = breakevenPrice(it, ch);
  const opt = optimalPrice(it, ch);
  const curMonthly = demandAt(it, ch, it.price) * cur.profit;
  const si = stockInfo(it);

  if (override && override > 0) {
    const cc = calcItem(it, ch, override);
    const q = demandAt(it, ch, override);
    const monthly = q * cc.profit;
    const diff = monthly - curMonthly;
    return `<b>${esc(it.name)}</b> — считаю цену ${money(override)}
    <div class="acard">
      ${aRow('Прибыль с единицы', money(cc.profit), cc.profit >= 0 ? 'pos' : 'neg')}
      ${aRow('Маржа', pctf(cc.margin))}
      ${aRow('Прогноз спроса', nf1.format(q) + ' шт/мес')}
      ${aRow('Прибыль в месяц', money(monthly), monthly >= 0 ? 'pos' : 'neg')}
      ${aRow('Сейчас в месяц', money(curMonthly))}
      ${aRow('Разница', (diff >= 0 ? '+' : '') + money(diff), diff >= 0 ? 'pos' : 'neg')}
    </div>
    <div class="acard">${cc.profit <= 0
      ? `<b class="neg">Это ниже безубытка.</b> Минимальная цена — ${money(be)}.`
      : `Запас над безубытком — ${money(override - be)}.`}
      <div style="margin-top:8px"><button class="btn sm primary" data-action="apply-price" data-id="${it.id}" data-price="${Math.round(override)}">Применить ${money(override)}</button></div>
    </div>`;
  }

  const gap = opt.price - it.price;
  const maxDiscount = it.price > 0 ? Math.max(0, (1 - be / it.price) * 100) : 0;
  const hopeless = it.price > 0 && be > it.price;
  return `<b>${esc(it.name)}</b> — рекомендация по цене
  <div class="acard">
    ${aRow('Сейчас', money(it.price))}
    ${aRow('Рекомендую', money(opt.price), gap >= 0 ? 'pos' : 'warn')}
    ${aRow('Прогноз прибыли/мес', money(opt.monthly), 'pos')}
    ${aRow('Безубыток', money(be))}
    ${aRow('Макс. скидка без убытка', pctf(maxDiscount))}
    ${aRow('Остаток на складе', nf.format(it.qty) + ' шт на ' + daysText(si.days))}
  </div>
  <div class="acard">${hopeless
    ? `<b class="neg">Экономика не сходится.</b> Чтобы выйти в ноль, нужна цена ${money(be)}, а вы продаёте за ${money(it.price)}. Меняйте поставщика или откажитесь от позиции.`
    : gap > 0
      ? `Цену можно поднять на <b>${money(gap)}</b>: спрос немного просядет, но прибыль вырастет.`
      : gap < 0 ? `Цена выше оптимума — скидка <b>${money(-gap)}</b> ускорит оборот.` : 'Цена уже близка к оптимуму.'}
    <div style="margin-top:8px"><button class="btn sm primary" data-action="apply-price" data-id="${it.id}" data-price="${opt.price}">Поставить ${money(opt.price)}</button></div>
  </div>`;
}

function aStock() {
  const rows = purchaseRows().sort((a, b) => b.si.qty * b.price - a.si.qty * a.price);
  const t = totals();
  return `<b>Склад магазина</b>
  <div class="acard">
    ${aRow('Позиций', rows.length)}
    ${aRow('Единиц', nf.format(t.units))}
    ${aRow('Стоимость по закупке', money(t.cost))}
    ${aRow('Потенциал выручки', money(t.rev))}
    ${aRow('Потенциал прибыли', money(t.profit), t.profit >= 0 ? 'pos' : 'neg')}
    ${aRow('Синхронизация', fmtAgo(S.settings.lastSync))}
  </div>
  <div class="acard">
    <table>
      <tr><th>Товар</th><th>Остаток</th><th>Хватит</th></tr>
      ${rows.slice(0, 12).map((r) => `<tr><td>${esc(r.it.name)}</td><td class="${r.si.qty <= 0 ? 'neg' : ''}">${nf.format(r.si.qty)} шт</td><td>${daysText(r.si.days)}</td></tr>`).join('')}
    </table>
  </div>
  <div class="acard">${rows.some((r) => r.si.qty <= 0) ? 'Есть позиции без остатка — они видны на витрине, но недоступны к покупке.' : 'Все позиции в наличии.'} Спросите «что закупить», чтобы увидеть план.</div>`;
}

function aPurchase(budgetOverride) {
  const p = purchasePlan(budgetOverride);
  const s = S.settings;
  if (!p.buy.length) {
    return `<b>Закупать сейчас нечего</b>
    <div class="acard">Остатков хватает на ${n(s.coverageDays)} дней покрытия при текущей скорости. Бюджет ${money(p.budget)} не нужен.</div>
    <div class="acard">${p.over.length ? `Но есть излишки: ${p.over.map((r) => esc(r.it.name)).join(', ')}. Спросите «излишки».` : 'Проверьте нормативы в настройках, если хотите держать больше запаса.'}</div>`;
  }
  return `<b>Что закупить</b>
  <div class="acard">
    ${aRow('Бюджет', money(p.budget))}
    ${aRow('Нужно', p.needUnits + ' шт')}
    ${aRow('Сумма по плану', money(p.needMoney))}
    ${aRow('Влезает в бюджет', p.fitUnits + ' шт · ' + money(p.budget - p.left), p.overBudget.length ? 'warn' : 'pos')}
  </div>
  <div class="acard">
    <table>
      <tr><th>Товар</th><th>Купить</th><th>До / шт</th></tr>
      ${p.buy.map((r) => `<tr>
        <td>${esc(r.it.name)}${r.overBudget ? ' <span class="mini warn">не влезает</span>' : ''}</td>
        <td><b>${r.fit > 0 ? r.fit : r.reco}</b> шт</td>
        <td>${r.maxCostTarget > 0 ? money(r.maxCostTarget) : '—'}</td>
      </tr>`).join('')}
    </table>
  </div>
  <div class="acard">
    ${p.no.length ? `<b class="neg">Не закупать:</b> ${p.no.map((r) => esc(r.it.name)).join(', ')} — закупка выше максимальной.<br>` : ''}
    ${p.over.length ? `<b class="warn">Распродать излишек:</b> ${p.over.map((r) => esc(r.it.name)).join(', ')}.<br>` : ''}
    ${p.missingCost.length ? `<b>Без закупочной цены:</b> ${p.missingCost.map((r) => esc(r.it.name)).join(', ')} — суммы оценочные, заполните закупку.<br>` : ''}
    ${p.overBudget.length ? 'Часть позиций не влезла в бюджет: приоритет отдан тем, что закончатся раньше.' : 'План помещается в бюджет целиком.'}
  </div>`;
}

function aPurchaseItem(it) {
  const r = purchaseRow(it);
  const plan = purchasePlan();
  const row = plan.buy.find((x) => x.it.id === it.id);
  const verdict = r.verdict === 'no'
    ? `<b class="neg">Закупать нельзя по этой цене.</b> Максимум для нулевой прибыли — ${money(r.maxCostBE)}, для маржи ${n(S.settings.targetMargin)}% — ${money(r.maxCostTarget)}.`
    : r.si.qty <= 0
      ? `<b class="neg">Товара нет в наличии.</b> Это потерянные продажи: позиция на витрине, но купить нельзя.`
      : r.verdict === 'over'
        ? `<b class="warn">Излишек.</b> Хватит на ${daysText(r.si.days)} — сначала распродайте, потом закупайте.`
        : r.si.reco > 0
          ? `Купить <b>${r.si.reco} шт</b> до ${money(r.maxCostTarget)}/шт, чтобы выйти на ${n(S.settings.coverageDays)} дней покрытия.`
          : 'Пока хватает остатка, докупать не нужно.';
  return `<b>Закуп: ${esc(it.name)}</b>
  <div class="acard">
    ${aRow('Остаток', nf.format(it.qty) + ' шт')}
    ${aRow('Скорость', nf1.format(r.si.vel.v) + ' шт/мес · ' + velSrcLabel(r.si.vel.src))}
    ${aRow('Хватит на', daysText(r.si.days))}
    ${aRow('Нужно закупить', r.si.reco + ' шт')}
    ${aRow('В бюджет', row ? row.fit + ' шт · ' + money(row.sum) : '—')}
    ${aRow('Макс. закуп для маржи', r.maxCostTarget > 0 ? money(r.maxCostTarget) : '—')}
    ${aRow('Макс. закуп в ноль', r.maxCostBE > 0 ? money(r.maxCostBE) : '—')}
    ${aRow('Плановая закупка', r.known ? money(r.unitPlan) : 'оценка ' + money(r.unitPlan))}
    ${aRow('Лучший канал', r.ch.name)}
    ${aRow('До закупки с единицы', money(r.net))}
  </div>
  <div class="acard">${verdict}</div>`;
}

function aDeficit() {
  const p = purchasePlan();
  const low = p.rows.filter((r) => r.si.qty > 0 && r.si.daily > 0 && r.si.days <= r.si.lead + r.si.safe)
    .sort((a, b) => a.si.days - b.si.days);
  const out = p.outStock;
  if (!out.length && !low.length) return '<b>Дефицита нет.</b><div class="acard">Все позиции в наличии и покрытия хватает на срок поставки плюс страховой запас.</div>';
  return `<b>Чего не хватает</b>
  ${out.length ? `<div class="acard"><div class="at">Нет в наличии</div><ul>${out.map((r) => `<li><b>${esc(r.it.name)}</b> — закупить ${r.si.reco} шт до ${money(r.maxCostTarget)}/шт</li>`).join('')}</ul></div>` : ''}
  ${low.length ? `<div class="acard"><div class="at">Скоро закончится</div><ul>${low.map((r) => `<li><b>${esc(r.it.name)}</b> — ${nf.format(r.it.qty)} шт, хватит на ${daysText(r.si.days)}</li>`).join('')}</ul></div>` : ''}
  <div class="acard">Срок поставки ${n(S.settings.leadDays)} дн + страховой запас ${n(S.settings.safetyDays)} дн. Заказывайте так, чтобы товар пришёл до нуля.</div>`;
}

function aOverstock() {
  const p = purchasePlan();
  const over = p.over.slice().sort((a, b) => b.si.qty * b.price - a.si.qty * a.price);
  if (!over.length) return '<b>Излишков нет.</b><div class="acard">Запасы соответствуют скорости продаж. Деньги не заморожены.</div>';
  const money_ = over.reduce((s, r) => s + r.si.qty * r.price, 0);
  return `<b>Излишки и замороженные деньги</b>
  <div class="acard">
    ${aRow('Позиций', over.length)}
    ${aRow('Стоимость по ценам продажи', money(money_))}
  </div>
  <div class="acard">
    <table>
      <tr><th>Товар</th><th>Остаток</th><th>Хватит</th></tr>
      ${over.map((r) => `<tr><td>${esc(r.it.name)}</td><td>${nf.format(r.it.qty)} шт</td><td>${daysText(r.si.days)}</td></tr>`).join('')}
    </table>
  </div>
  <div class="acard">Что делать: скидка 5–10%, закреп объявления, продажа комплектом или через Telegram-канал. Не закупайте эти позиции, пока остаток не снизится до ${n(S.settings.coverageDays)} дней.</div>`;
}

function aRisks() {
  const p = purchasePlan();
  const risks = [];
  if (p.outStock.length) risks.push(`<b class="neg">${p.outStock.length} позиций без остатка:</b> ${p.outStock.map((r) => esc(r.it.name)).join(', ')}. Витрина продаёт то, чего нет.`);
  const soon = p.rows.filter((r) => r.si.qty > 0 && r.si.daily > 0 && r.si.days <= r.si.lead + r.si.safe);
  if (soon.length) risks.push(`<b class="warn">На исходе:</b> ${soon.map((r) => `${esc(r.it.name)} (${daysText(r.si.days)})`).join(', ')}.`);
  if (p.no.length) risks.push(`<b class="neg">Закупка дороже максимума:</b> ${p.no.map((r) => `${esc(r.it.name)} (${money(r.cost)} против ${money(r.maxCostBE)})`).join(', ')}.`);
  if (p.over.length) risks.push(`<b class="warn">Замороженные деньги:</b> ${p.over.map((r) => `${esc(r.it.name)} — ${nf.format(r.it.qty)} шт`).join(', ')}.`);
  if (p.missingCost.length) risks.push(`<b class="warn">Нет закупочной цены</b> у ${p.missingCost.length} позиций — реальная маржа неизвестна.`);
  if (!S.settings.lastSync) risks.push('<b class="warn">Магазин не синхронизирован.</b> Остатки могут быть неверными.');
  else if (Date.now() - n(S.settings.lastSync) > 86400000) risks.push(`<b class="warn">Данные устарели:</b> последняя синхронизация ${fmtAgo(S.settings.lastSync)}.`);
  if (S.settings.tax === 'none') risks.push('<b class="warn">Налог не учтён</b> — прибыль завышена на 4–15% с оборота.');
  if (p.rows.some((r) => r.si.vel.src === 'default')) risks.push('<b class="warn">Скорость продаж — норматив, а не факт.</b> Нужна история остатков или ручной ввод на складе.');
  if (!risks.length) risks.push('<b class="pos">Критичных рисков не вижу.</b> Остатки покрыты, закупки проходят по марже, данные свежие.');
  return `<b>Риски по складу</b><div class="acard"><ul>${risks.map((r) => `<li>${r}</li>`).join('')}</ul></div>`;
}

function aPlan() {
  const p = purchasePlan();
  const steps = [];
  if (!S.settings.lastSync) steps.push('<b>Синхронизируйте магазин</b> — без остатков любой план будет гаданием.');
  const urgent = p.buy.slice(0, 3);
  if (urgent.length) steps.push(`<b>Закажите сейчас:</b> ${urgent.map((r) => `${esc(r.it.name)} — ${r.reco} шт`).join(', ')}. Общая сумма по плану — ${money(p.needMoney)}.`);
  if (p.no.length) steps.push(`<b>Уберите из закупа:</b> ${p.no.map((r) => esc(r.it.name)).join(', ')}. Закупочная цена выше максимальной для целевой маржи.`);
  if (p.over.length) steps.push(`<b>Распродайте излишки:</b> ${p.over.map((r) => esc(r.it.name)).join(', ')}. Скидка 5–10% вернёт деньги в оборот.`);
  if (p.missingCost.length) steps.push(`<b>Заполните закупку</b> у ${p.missingCost.length} позиций — иначе маржа и бюджет считаются по оценке.`);
  if (p.overBudget.length) steps.push(`<b>Бюджета не хватает</b> на ${p.overBudget.length} позиций. Увеличьте бюджет или разбейте закуп на две волны.`);
  if (S.settings.tax === 'none') steps.push('<b>Включите налог</b> в настройках — иначе решения принимаются по завышенной прибыли.');
  if (!steps.length) steps.push('Всё в порядке: остатков хватает, закупки проходят по марже. Можно тестировать повышение цены на 3–5%.');
  return `<b>План действий</b><div class="acard"><ul>${steps.map((s) => `<li>${s}</li>`).join('')}</ul></div>`;
}

function aBuyer(it) {
  const ch = channelOf(it.channel);
  const c = calcItem(it, ch);
  const score = listingScore(it);
  const share = shareAt(it, it.price);
  const obj = buyerObjections(it, c, score);
  return `<b>Как «${esc(it.name)}» видит покупатель</b>
  <div class="acard">
    ${aRow('Цена', money(it.price))}
    ${aRow('Маржа', pctf(c.margin), c.margin >= 25 ? 'pos' : c.margin >= 10 ? '' : 'neg')}
    ${aRow('Шанс, что выберут вас', Math.round(share) + '%')}
    ${aRow('Сила карточки', score + '/100')}
    ${aRow('Остаток', nf.format(it.qty) + ' шт')}
  </div>
  <div class="acard"><ul>${obj.map((o) => `<li><b>${o.t}.</b> ${o.x}</li>`).join('')}</ul></div>
  <div class="acard">Вывод: ${c.margin < 12
    ? 'маржа тонкая: скидка или возврат уводят в минус. Сначала пересчитайте закупку и канал.'
    : score < 55
      ? 'дело не в цене, а в доверии. Фото, отзывы и гарантия дадут больше, чем скидка 5%.'
      : 'предложение конкурентоспособно. Можно тестировать +3–5% к цене и следить за откликом.'}</div>`;
}

function listingText(it) {
  const c = calcItem(it);
  const used = /б\/у|бу|б\.у|used/.test(norm(it.note)) || /б\/у/.test(norm(it.name));
  const cond = used ? 'б/у, в хорошем состоянии' : 'новый';
  let title = `${it.name} — ${used ? 'б/у' : 'новый'}`;
  if (title.length > 50) title = it.name.slice(0, 50);
  const lines = [];
  lines.push(`Продаю: ${it.name}.`);
  lines.push(`Состояние: ${cond}.${it.note ? ' ' + it.note + '.' : ''}`);
  if (it.flags && it.flags.warranty) lines.push('Даю 14 дней на проверку: если что-то не так — верну деньги.');
  else lines.push('Проверка при встрече, показываю работу товара.');
  if (it.flags && it.flags.delivery) lines.push('Доставка по городу, Авито Доставка или СДЭК. В Telegram — отправлю photo/video и оформлю заказ.');
  else lines.push('Самовывоз, возможна встреча в центре.');
  lines.push(`Цена ${money(it.price)}.`);
  if (c.margin > 20) lines.push('Небольшой торг для быстрого покупателя.');
  else lines.push('Цена уже минимальная, торг символический.');
  lines.push('Пишите в сообщения — отвечу быстро, пришлю дополнительные фото и видео.');
  if (it.url) lines.push('Все товары и оформление заказа: ' + it.url);
  return { title, body: lines.join('\n') };
}

function aListing(it) {
  const l = listingText(it);
  return `<b>Объявление для «${esc(it.name)}»</b>
  <div class="acard">
    ${aRow('Заголовок', `${l.title.length}/50 симв.`)}
    <div style="margin-top:6px;font-weight:600">${esc(l.title)}</div>
  </div>
  <div class="acard">
    <div class="at">Описание</div>
    <div id="listingText" style="white-space:pre-wrap;font-size:12.5px;color:#b9c8d9;line-height:1.6">${esc(l.body)}</div>
    <div style="margin-top:9px"><button class="btn sm" data-action="copy" data-target="#listingText">Скопировать текст</button></div>
  </div>
  <div class="acard"><b>Что добавит продаж:</b>
    <ul>
      <li>первое фото — товар целиком на светлом фоне, без коллажей;</li>
      <li>в заголовке — модель и ключевое преимущество, без «СРОЧНО»;</li>
      <li>цена ${money(it.price)} — ${n(it.price) % 100 === 0 ? 'попробуйте окончание 90/99, оно читается ниже' : 'удачное окончание, не округляйте вверх'};</li>
      <li>в Telegram закрепите пост с товаром и добавьте кнопку «Написать».</li>
    </ul>
  </div>`;
}

function aSummary() {
  const t = totals();
  const p = purchasePlan();
  const st = syncState();
  return `<b>Сводка по магазину</b>
  <div class="acard">
    ${aRow('Позиций / единиц', p.rows.length + ' / ' + nf.format(t.units))}
    ${aRow('Стоимость склада', money(t.cost))}
    ${aRow('Потенциал выручки', money(t.rev))}
    ${aRow('Потенциал прибыли', money(t.profit), t.profit >= 0 ? 'pos' : 'neg')}
    ${aRow('Маржа склада', pctf(t.margin))}
    ${aRow('Нет в наличии', p.outStock.length)}
    ${aRow('Нужно закупить', p.needUnits + ' шт · ' + money(p.needMoney))}
    ${aRow('Синхронизация', st.text + ' · ' + fmtAgo(S.settings.lastSync))}
  </div>
  <div class="acard">
    ${p.outStock.length ? `Без остатка: <b>${p.outStock.map((r) => esc(r.it.name)).join(', ')}</b>.<br>` : ''}
    ${p.over.length ? `Излишки: ${p.over.map((r) => esc(r.it.name)).join(', ')}.<br>` : ''}
    ${p.no.length ? `Не закупать: ${p.no.map((r) => esc(r.it.name)).join(', ')}.<br>` : ''}
    ${t.margin >= 25 ? 'Маржа здоровая — есть запас на скидки и возвраты.' : t.margin > 0 ? 'Маржа ниже комфортной: проверьте закупки и канал.' : 'Маржа нулевая или минусовая — сначала пересчитайте закупки.'}
  </div>`;
}

function aTax() {
  const t = totals();
  const mode = S.settings.tax;
  const label = (TAX_MODES.find((m) => m.id === mode) || TAX_MODES[0]).label;
  const selfLimit = 2400000;
  let advice = '';
  if (mode === 'none') advice = '<b class="warn">Сейчас налог не учитывается</b> — прибыль в таблице завышена. Для перепродажи чаще всего подходит самозанятость (6% с дохода) или УСН 6%.';
  else if (mode === 'self') advice = `Самозанятость удобна, но есть лимит ${money(selfLimit)} дохода в год и запрет на перепродажу чужих товаров — проверьте, подходит ли вам режим. При обороте выше лимита — УСН.`;
  else if (mode === 'usn6') advice = 'УСН 6% считается с оборота, а не с прибыли. При марже ниже 20% налог ощутимо съедает результат.';
  else advice = 'УСН 15% выгоден при высокой марже и документах на расходы: налог платится с разницы.';
  return `<b>Налоги</b>
  <div class="acard">
    ${aRow('Режим', label)}
    ${aRow('Налог со склада', money(t.tax))}
    ${aRow('Прибыль после налога', money(t.profit), t.profit >= 0 ? 'pos' : 'neg')}
    ${aRow('Эффективная ставка', pctf(t.rev > 0 ? (t.tax / t.rev) * 100 : 0))}
  </div>
  <div class="acard">${advice}</div>`;
}

function budgetFromText(q) {
  const m = q.match(/(?:на|бюджет[а-я]*)\s*(\d[\d\s]{1,9})/);
  if (!m) return 0;
  let v = n(m[1].replace(/\s/g, ''));
  if (/тыс|к\b/.test(q)) v *= 1000;
  return v > 0 ? v : 0;
}

async function agentRespond(raw) {
  const q = norm(raw);

  if (/синхрон|обнови данн|подтяни|загрузи.*(магазин|остат)|sync/.test(q)) {
    const res = await syncStore({ silent: true });
    if (!res) return 'Синхронизация уже идёт — подождите пару секунд.';
    if (!res.ok) return `<b>Не получилось синхронизировать.</b><div class="acard">${esc(res.error)}</div><div class="acard">Проверьте интернет и адреса в настройках. Каталог: ${esc(S.settings.catalogUrl)}</div>`;
    const p = purchasePlan();
    return `<b>Готово, данные магазина обновлены.</b>
    <div class="acard">
      ${aRow('Товаров', res.total)}
      ${aRow('В наличии', res.inStock)}
      ${aRow('Нет в наличии', p.outStock.length)}
      ${aRow('Нужно закупить', p.needUnits + ' шт')}
      ${aRow('Бюджет плана', money(p.needMoney))}
    </div>
    ${res.stockFailed ? '<div class="acard"><b class="warn">Остатки не обновились:</b> каталог загружен, но endpoint остатков не ответил. Цифры наличия могут быть из products.json.</div>' : ''}
    <div class="acard">Спросите «что закупить» — соберу список с максимальными ценами.</div>`;
  }

  if (!S.items.length) {
    return 'Магазин пока не подключён. Нажмите «Синхронизировать» — подтяну товары, цены и остатки, и сразу посчитаю закуп.';
  }
  if (/^(привет|здравств|хай|добрый)/.test(q)) return chatGreeting();

  const it = findItemByText(q);
  const budget = budgetFromText(q);
  const priceM = q.match(/(?:по|за)\s*(\d[\d\s]{2,9})/);
  let override = priceM ? n(priceM[1].replace(/\s/g, '')) : 0;
  const discM = q.match(/(?:на|скидк\w*)\s*(\d{1,2})\s*%/);
  const upM = q.match(/(?:подня\w*|подним\w*|увелич\w*|накинуть)[^\d]{0,12}(\d{1,2})\s*%/);
  if (it && !override) {
    if (discM) override = Math.round(it.price * (1 - n(discM[1]) / 100));
    else if (upM) override = Math.round(it.price * (1 + n(upM[1]) / 100));
  }

  if (it && /закуп|заказ|докупить|дозаказ|сколько брать|парти/.test(q)) return aPurchaseItem(it);
  if (/закуп|заказать|докупить|пополнить|что брать|план закуп/.test(q)) return aPurchase(budget);
  if (/дефицит|не хватает|заканчива|на исходе|нет в наличии|пусто/.test(q)) return aDeficit();
  if (/излиш|распрода|заморож|залежал|не продается|не продаётся/.test(q)) return aOverstock();
  if (/склад|остат|наличи|что есть|сколько товар/.test(q) && !/закуп/.test(q)) return aStock();

  if (/объявлен|описан|заголовок|текст для|напиши текст/.test(q)) return aListing(it || S.items[0]);
  if (/риск|опасн|проблем|что не так|слабые мест/.test(q)) return aRisks();
  if (/план|что делать|улучш|совет|рекоменд|шаг|стратег/.test(q)) return aPlan();
  if (/налог|усн|самозанят/.test(q)) return aTax();
  if (/покупател|клиент|спрос|конверс|возраж|торг/.test(q) && it) return aBuyer(it);
  if (/где|куда|площадк|канал|выгодн.*прода|лучше.*прода|авито|телеграм/.test(q)) return aChannels(it);
  if (override > 0 && it) return aPrice(it, override);
  if (/цен|стоит|дорог|дешев|скидк|подня|оптимальн|безубыт|маржинальн/.test(q) && it) return aPrice(it);
  if (it) return aItemCard(it);
  if (/итог|обзор|сводк|как дела|сколько заработа/.test(q)) return aSummary();

  return `Уточните запрос — я работаю по вашему складу и остаткам магазина. Могу:
  <div class="acard"><ul>
    <li><b>«Что закупить»</b> — список с количеством, бюджетом и максимальной ценой закупа;</li>

    <li><b>«Текст объявления»</b> — готовое описание.</li>
  </ul></div>`;
}

async function sendChat(text) {
  const input = $('#chatText');
  const msg = String(text || (input && input.value) || '').trim();
  if (!msg) return;
  S.ui.chat.push({ role: 'user', text: msg });
  if (input) input.value = '';
  save();
  if (S.ui.view !== 'agent') setView('agent');
  else renderAgent();

  let html = '';
  try {
    html = await agentRespond(msg);
  } catch (e) {
    html = 'Что-то пошло не так при расчёте: ' + esc(errText(e));
  }
  S.ui.chat.push({ role: 'bot', html });
  if (S.ui.chat.length > 80) S.ui.chat = S.ui.chat.slice(-80);
  save();
  if (S.ui.view === 'agent') renderAgent();
}

  if (!price && cost) price = roundPrice(cost * 1.5);
  const data = {
    name: String(fd.get('name') || '').trim(),
    category: String(fd.get('category') || 'Прочее').trim() || 'Прочее',
    qty: Math.max(0, n(fd.get('qty'))),
    cost: Math.max(0, cost),
    inbound: Math.max(0, n(fd.get('inbound'))),
    prep: Math.max(0, n(fd.get('prep'))),
    price: Math.max(0, price),
    channel: String(fd.get('channel') || 'avito'),
    velocity: Math.max(0, n(fd.get('velocity'))),
    note: String(fd.get('note') || '').trim()

function applyBackup(obj) {
  if (!obj || !Array.isArray(obj.items)) throw new Error('bad');
  const fresh = blankState();
  S.items = obj.items
    .filter((x) => x && x.name && !LEGACY_DEMO.includes(norm(x.name)))
    .map(normalizeItem);
  S.channels = CH_PRESETS.map((cp) => {
    const f = (Array.isArray(obj.channels) ? obj.channels : []).find((c) => c && c.id === cp.id);
    return Object.assign({}, cp, f || {});
  });
  S.settings = Object.assign(fresh.settings, obj.settings || {});
  // бэкап мог быть снят до подключения магазина — оставляем рабочие адреса
  ['catalogUrl', 'stockUrl', 'storeUrl'].forEach((k) => {
    if (!String(S.settings[k] || '').trim()) S.settings[k] = fresh.settings[k];
  });
  S.ui = Object.assign(fresh.ui, obj.ui || {});
  if (!Array.isArray(S.ui.chat)) S.ui.chat = [];
  S.ui.buyerItemId = S.items[0] ? S.items[0].id : null;
}

function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2400);
}

function copyText(text, okMsg) {
  const done = () => toast(okMsg || 'Скопировано');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Не удалось скопировать'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else fallback();
}

  if (a === 'tg-share') {
    const url = location.origin && location.origin !== 'null' ? location.origin + location.pathname : location.href;
    if (IN_TG && TG.openTelegramLink) {
      try {
        TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent('МАРЖА — агент закупок и продаж'));
      } catch (err) { copyText(url, 'Ссылка скопирована'); }
    } else copyText(url, 'Ссылка скопирована');
    return;
  }
  if (a === 'copy-plan') { copyText(planText(), 'Список закупа скопирован'); return; }
  if (a === 'export-plan') { exportPlan(); return; }
  if (a === 'clear-history') {
    if (!confirm('Сбросить историю остатков? Скорость продаж снова будет считаться по нормативу.')) return;
    S.items.forEach((it) => { it.history = []; it.velocityMode = 'auto'; });
    save(); render(); toast('История остатков очищена');
    return;
  }

  if (a === 'del-item') {
    haptic('warning');
    const it = getItem(el.dataset.id);
    const warn = it && it.pfId ? ' Вернётся при следующей синхронизации.' : '';
    if (it && confirm('Удалить «' + it.name + '»?' + warn)) {
      S.items = S.items.filter((x) => x.id !== it.id);
      if (S.ui.buyerItemId === it.id) S.ui.buyerItemId = S.items[0] ? S.items[0].id : null;
      save(); render(); toast('Удалено');
    }
    return;
  }
  if (a === 'reset') {
    if (!confirm('Удалить все данные без возможности восстановления?')) return;
    localStorage.removeItem(KEY);
    location.reload();
    return;
  }
  if (a === 'chip') { sendChat(el.dataset.text); return; }
  if (a === 'clear-chat') {
    S.ui.chat = [];
    save(); renderAgent(); toast('История очищена');
    return;
  }
  if (a === 'apply-price') {
    const it = getItem(el.dataset.id);
    const p = n(el.dataset.price);
    if (it && p > 0) {
      it.price = p; save();
      if (S.ui.view === 'buyer') renderBuyer(); else setView('buyer');
      renderSide();
      toast('Цена обновлена: ' + money(p));
    }
    return;
  }
  if (a === 'copy') {
    const t = $(el.dataset.target);
    if (t) copyText(t.innerText || t.textContent || '');
    return;
  }
});

function modalIsOpen() { return !!document.getElementById('overlay'); }

function autoSyncIfStale() {
  if (!S.settings.autoSync || syncing || modalIsOpen()) return;
  if (!String(S.settings.catalogUrl || '').trim()) return;
  const age = Date.now() - n(S.settings.lastSync);
  if (S.settings.lastSync && age < 10 * 60 * 1000) return;
  syncStore({ silent: true });
}

if (S.settings.autoSync) setTimeout(autoSyncIfStale, 400);

let lastFocusSync = 0;
window.addEventListener('focus', () => {
  if (Date.now() - lastFocusSync < 20000) return;
  lastFocusSync = Date.now();
  autoSyncIfStale();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - lastFocusSync < 20000) return;
  lastFocusSync = Date.now();
  autoSyncIfStale();
});
